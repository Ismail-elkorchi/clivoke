name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to validate without publishing
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout released ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref }}
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.0.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Setup npm
        run: npm install --global npm@11.19.0
      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.6.7
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3
      - name: Install completion shells
        run: |
          sudo apt-get update
          sudo apt-get install --yes fish zsh
          command -v pwsh
      - name: Resolve release metadata
        id: meta
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          publish=false
          if [ "${GITHUB_EVENT_NAME}" = release ]; then
            publish=true
            if [ "${RELEASE_TAG}" != "v${version}" ]; then
              echo "::error::Release tag ${RELEASE_TAG} does not match package version ${version}"
              exit 1
            fi
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::Release commit is not contained in main"
              exit 1
            fi
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm ci
      - name: Validate
        env:
          RELEASE_TAG: v${{ steps.meta.outputs.version }}
        run: npm run check && npm run release:gate -- "${RELEASE_TAG}"
      - name: Inspect registry versions
        if: ${{ steps.meta.outputs.publish == 'true' }}
        id: registry
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          npm_exists=false
          if npm view "clivoke@${VERSION}" version >/dev/null 2>&1; then
            npm_exists=true
          fi
          export JSR_META
          JSR_META="$(curl --fail --silent --show-error 'https://jsr.io/@ismail-elkorchi/clivoke/meta.json')"
          jsr_exists="$(node -e 'const meta = JSON.parse(process.env.JSR_META); process.stdout.write(String(Object.hasOwn(meta.versions || {}, process.env.VERSION)))')"
          if [ "${GITHUB_RUN_ATTEMPT}" = 1 ] && { [ "${npm_exists}" = true ] || [ "${jsr_exists}" = true ]; }; then
            echo "::error::Version ${VERSION} already exists on npm or JSR"
            exit 1
          fi
          echo "npm_exists=${npm_exists}" >> "$GITHUB_OUTPUT"
          echo "jsr_exists=${jsr_exists}" >> "$GITHUB_OUTPUT"
      - name: Publish npm
        if: ${{ steps.meta.outputs.publish == 'true' && steps.registry.outputs.npm_exists != 'true' }}
        run: npm publish --access public
      - name: Publish JSR
        if: ${{ steps.meta.outputs.publish == 'true' && steps.registry.outputs.jsr_exists != 'true' }}
        run: deno publish
      - name: Verify published packages
        if: ${{ steps.meta.outputs.publish == 'true' }}
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            [ "$(npm view "clivoke@${VERSION}" version 2>/dev/null || true)" = "${VERSION}" ] && break
            [ "${attempt}" = 12 ] && { echo "::error::npm did not return ${VERSION}"; exit 1; }
            sleep 5
          done
          for attempt in {1..12}; do
            export JSR_META
            JSR_META="$(curl --fail --silent --show-error --header 'Cache-Control: no-cache' 'https://jsr.io/@ismail-elkorchi/clivoke/meta.json')"
            node -e 'const meta = JSON.parse(process.env.JSR_META); process.exit(Object.hasOwn(meta.versions || {}, process.env.VERSION) ? 0 : 1)' && break
            [ "${attempt}" = 12 ] && { echo "::error::JSR did not return ${VERSION}"; exit 1; }
            sleep 5
          done
